name: Build and deploy Node.js app to Azure Web App - MidlandsAddressBookBackend

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: npm install, build, and test
        working-directory: backend
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present
          npm prune --omit=dev

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MidlandsAddressBookBackend'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Verify faker exists
        working-directory: backend
        run: |
          ls node_modules
          ls node_modules/@faker-js

      - name: Run one-time database seed
        shell: bash
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP 'userName="\K[^"]+' | head -n 1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP 'userPWD="\K[^"]+' | head -n 1)
          PUBLISH_URL=$(echo "$PUBLISH_PROFILE" | grep -oP 'publishUrl="\K[^"]+' | head -n 1)

          echo "Publish URL from profile: $PUBLISH_URL"

          SCM_HOST=$(echo "$PUBLISH_URL" | sed 's|https://||' | cut -d':' -f1)

          echo "SCM host: $SCM_HOST"

          curl -v -X POST "https://$SCM_HOST/api/command" \
            -u "$USERNAME:$PASSWORD" \
            -H "Content-Type: application/json" \
            -d '{
              "command": "export NODE_PATH=/node_modules && node dist/db/seed.js",
              "dir": "/home/site/wwwroot"
            }'